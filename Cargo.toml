[package]
name = "fasco"
version = "0.1.0"
edition = "2024"
description = "Fast AI chat client powered by Cerebras GLM-4.7"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rustyline = "14"
futures = "0.3"
async-stream = "0.3"
dirs = "5"
dotenvy = "0.15"
chrono = "0.4"

[dev-dependencies]
mockito = "1"

[lints.rust]
warnings = "warn"
dead_code = "allow"
